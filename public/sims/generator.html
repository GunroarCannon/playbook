<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="simCanvas"></canvas>
<script src="bench.js"></script>
<script>
/*
 * Generator Fuel Bench — the grid goes off at 18:00 for `outageH` hours and the generator carries the load.
 * Rated power (W) = kVA x 800 (power factor 0.8). Running above 90% of that overloads it.
 * Fuel (L/h) = rated kW x k x (0.25 + 0.75 x load fraction): a generator burns a quarter of its full-load fuel
 * just idling. k (litres per rated kWh) is higher for small units and lower for diesel.
 * Passes when: not overloaded, one tank lasts the whole outage, and a week of fuel fits the budget.
 */
const START = 18;
function simulate(p) {
  const kva = +p.genKva, ratedW = kva * 800, kw = ratedW / 1000;
  const load = +p.loadW, f = Math.min(1, load / ratedW);
  const k = p.fuel === "diesel" ? 0.32 + 0.2 / Math.sqrt(kw) : 0.6 + 0.4 / Math.sqrt(kw);
  const lph = kw * k * (0.25 + 0.75 * f);
  const hoursPerTank = +p.tankL / lph;
  const outage = +p.outageH;
  const dailyL = lph * outage, weekly = dailyL * 7 * +p.priceL;
  const overload = load > ratedW * 0.9;
  const tankOk = hoursPerTank >= outage;
  const budgetOk = weekly <= +p.budget;
  return { kva, ratedW, load, f, lph, hoursPerTank, outage, dailyL, weekly, overload, tankOk, budgetOk, ok: !overload && tankOk && budgetOk, emptyAt: tankOk ? null : hoursPerTank };
}

const money = (v) => Math.round(v).toLocaleString();
const clock = (h) => { const t = ((START + h) % 24 + 24) % 24; const hh = Math.floor(t), mm = Math.round((t - hh) * 60) % 60; return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`; };

let R = null, anim = null;
function publish(p) {
  R = simulate(p);
  Bench.metrics({
    stressRatio: Math.max(R.load / (R.ratedW * 0.9), R.outage / Math.max(0.1, R.hoursPerTank), R.weekly / Math.max(1, +p.budget)),
    label: `${R.lph.toFixed(2)} L/h at ${Math.round(R.f * 100)}% load · ${R.hoursPerTank.toFixed(1)} h a tank · ${money(R.weekly)} a week`,
    values: { litresPerHour: +R.lph.toFixed(2), hoursPerTank: +R.hoursPerTank.toFixed(1), weeklyCost: Math.round(R.weekly), loadPct: Math.round(R.f * 100) },
  });
}

Bench.init({
  params: { genKva: "2.5", fuel: "petrol", loadW: 1200, outageH: 8, tankL: 15, priceL: 1000, budget: 80000 },
  onParams(p) { if (!anim || anim.done) anim = null; publish(p); },
  onReset(p) { anim = null; publish(p); },
  onRun(p) { publish(p); anim = { t0: performance.now() / 1000, dur: 6, done: false, p: { ...p } }; },
  draw(D, p, dt, now) {
    if (!R) publish(p);
    const { ctx, C } = D;
    D.grid();
    const W = D.W, H = D.H;
    const prog = anim ? Math.min(1, (now - anim.t0) / anim.dur) : 1;
    if (anim && !anim.done && prog >= 1) { anim.done = true; finish(anim.p); }
    const hNow = prog * 24; // hours since 18:00
    const inOutage = hNow < R.outage;
    const running = anim && !anim.done ? inOutage && (R.tankOk || hNow < R.hoursPerTank) : false;

    D.text(`${p.genKva} kVA ${p.fuel} generator carrying ${money(R.load)} W for ${R.outage} h a night`, 18, 28, { size: 14 });
    D.text(`${R.lph.toFixed(2)} L/h · ${R.dailyL.toFixed(1)} L a night · ${money(R.weekly)} a week at ${money(+p.priceL)}/L`, 18, 48, { size: 12, mono: true, color: C.ink2 });

    // ---- 24 h strip: grid on/off, fuel in the tank
    const gx = 60, gw = Math.max(240, W - gx - 230), gy0 = 84, gh = Math.max(100, H - 200), gy = gy0 + gh;
    const X = (h) => gx + (h / 24) * gw;
    // outage band
    ctx.fillStyle = C.ink; ctx.globalAlpha = 0.06; ctx.fillRect(X(0), gy0, X(R.outage) - X(0), gh); ctx.globalAlpha = 1;
    D.text(`grid OFF (${R.outage} h)`, X(R.outage / 2), gy0 - 6, { size: 11, align: "center", color: C.red });
    if (R.outage < 24) D.text("grid ON", X((R.outage + 24) / 2), gy0 - 6, { size: 11, align: "center", color: C.green });
    D.line(gx, gy, gx + gw, gy, { width: 1.3 }); D.line(gx, gy0, gx, gy, { width: 1.3 });
    for (let h = 0; h <= 24; h += 3) D.text(clock(h), X(h), gy + 14, { size: 10, mono: true, align: "center", color: C.ink3 });
    const Y = (l) => gy - (l / +p.tankL) * gh;
    D.text(`${p.tankL} L`, gx - 6, Y(+p.tankL) + 4, { size: 10, mono: true, align: "right", color: C.ink3 });
    D.text("0", gx - 6, gy + 4, { size: 10, mono: true, align: "right", color: C.ink3 });
    // fuel line: drains while running, then refilled in the morning when the grid is back
    const lastH = anim ? hNow : 24;
    ctx.strokeStyle = C.amber; ctx.lineWidth = 2.4; ctx.beginPath();
    for (let i = 0; i <= 96; i++) {
      const h = (i / 96) * 24; if (h > lastH) break;
      const fuel = h < R.outage ? Math.max(0, +p.tankL - R.lph * h) : Math.max(0, +p.tankL - R.lph * R.outage);
      i ? ctx.lineTo(X(h), Y(fuel)) : ctx.moveTo(X(h), Y(fuel));
    }
    ctx.stroke();
    D.text("fuel in the tank", gx + 8, gy0 + 14, { size: 11, color: C.amber });
    if (R.emptyAt != null) {
      D.line(X(R.emptyAt), gy0, X(R.emptyAt), gy, { color: C.red, dash: [3, 3], width: 1.2, single: true });
      D.text(`empty at ${clock(R.emptyAt)}`, X(R.emptyAt) + 4, gy - 8, { size: 11, color: C.red });
    }
    if (anim) D.line(X(hNow), gy0, X(hNow), gy, { color: C.ink2, width: 1, dash: [2, 3], single: true });

    // ---- the generator
    const bx = W - 200, by = gy0 + 26, bw = 150, bh = 74;
    D.rect(bx, by, bw, bh, { fill: C.paper, seed: 51 });
    D.rect(bx + 10, by + 10, 60, 36, { hatch: true, seed: 52 });
    D.circle(bx + 110, by + 30, 16, { seed: 53 });
    // fuel gauge on the engine
    const fuelNow = anim ? (inOutage ? Math.max(0, +p.tankL - R.lph * hNow) : Math.max(0, +p.tankL - R.lph * R.outage)) : +p.tankL;
    const ga = Math.PI + (fuelNow / +p.tankL) * Math.PI;
    D.line(bx + 110, by + 34, bx + 110 + Math.cos(ga) * 12, by + 34 + Math.sin(ga) * 12, { color: fuelNow <= 0.01 ? C.red : C.ink, width: 2, single: true });
    D.text("E   F", bx + 110, by + 52, { size: 9, mono: true, align: "center", color: C.ink3 });
    D.circle(bx + 20, by + bh + 8, 8, { seed: 54 }); D.circle(bx + bw - 20, by + bh + 8, 8, { seed: 55 });
    D.line(bx + bw, by + 12, bx + bw + 14, by + 12, { width: 2, seed: 56 }); D.line(bx + bw + 14, by + 12, bx + bw + 14, by - 8, { width: 2, seed: 57 });
    if (running) {
      const puffs = 2 + Math.round(R.f * 4), speed = 0.6 + R.f * 1.5;
      for (let k = 0; k < puffs; k++) {
        const ph = (now * speed + k / puffs) % 1;
        D.circle(bx + bw + 14 + ph * 20, by - 12 - ph * 46, 4 + ph * 9, { color: C.ink3, seed: 60 + k, rough: 2 });
      }
    }
    D.text(`${p.genKva} kVA ${p.fuel}`, bx + bw / 2, by + bh + 32, { size: 12, align: "center" });
    // load bar
    const lx = bx, ly = by + bh + 46, lw = bw;
    D.rect(lx, ly, lw, 12, { seed: 58 });
    const lf = D.clamp(R.load / R.ratedW, 0, 1);
    ctx.fillStyle = R.overload ? C.red : R.f > 0.75 ? C.amber : C.green; ctx.globalAlpha = 0.45; ctx.fillRect(lx + 1, ly + 1, (lw - 2) * lf, 10); ctx.globalAlpha = 1;
    D.line(lx + lw * 0.9, ly - 3, lx + lw * 0.9, ly + 15, { color: C.red, width: 1.2, single: true });
    D.text(`${money(R.load)} W of ${money(R.ratedW)} W`, lx + lw / 2, ly + 27, { size: 11, mono: true, align: "center", color: R.overload ? C.red : C.ink2 });
    // house light
    const lit = anim ? (inOutage ? running : true) : true;
    D.icon("lightbulb", bx - 34, by + 20, 28, { color: lit ? C.amber : C.ink3, alpha: lit ? 1 : 0.5 });
    D.text(anim ? clock(hNow) : "", bx - 34, by + 52, { size: 11, mono: true, align: "center", color: C.ink2 });

    // ---- checklist
    const cy = gy + 40;
    [[!R.overload, `load ${Math.round(R.f * 100)}% of rating ${R.overload ? "(overloaded)" : ""}`],
     [R.tankOk, `one tank lasts ${R.hoursPerTank.toFixed(1)} h of ${R.outage} h`],
     [R.budgetOk, `${money(R.weekly)} a week (budget ${money(+p.budget)})`]].forEach(([ok, t], i) => {
      D.text(ok ? "✓" : "✗", gx + i * Math.max(180, gw / 3), cy, { size: 15, color: ok ? C.green : C.red });
      D.text(t, gx + 16 + i * Math.max(180, gw / 3), cy, { size: 11, color: ok ? C.ink2 : C.red });
    });

    if (anim && anim.done) D.stamp(R.ok ? "LIGHTS ON ALL NIGHT" : !R.tankOk ? `RAN DRY AT ${clock(R.emptyAt)}` : R.overload ? "OVERLOADED" : "OVER BUDGET", gx + gw / 2, gy0 + gh * 0.45, R.ok ? C.green : C.red);
    if (!anim) D.text("(projection — press RUN TEST to run one night, 18:00 onward)", 18, H - 12, { size: 11, color: C.ink3 });
  },
});

function finish(p) {
  const desc = `${p.genKva} kVA ${p.fuel} generator, ${money(R.load)} W load, ${R.outage} h outage, ${p.tankL} L tank, fuel ${money(+p.priceL)}/L`;
  const stats = `burns ${R.lph.toFixed(2)} L/h (${R.dailyL.toFixed(1)} L a night), one tank lasts ${R.hoursPerTank.toFixed(1)} h, ${money(R.weekly)} a week`;
  const why = [];
  if (R.overload) why.push(`${money(R.load)} W is over 90% of the generator's ${money(R.ratedW)} W rating`);
  if (!R.tankOk) why.push(`the tank runs dry at ${clock(R.emptyAt)}, ${(R.outage - R.hoursPerTank).toFixed(1)} h before the grid returns`);
  if (!R.budgetOk) why.push(`fuel costs ${money(R.weekly)} a week, over the ${money(+p.budget)} budget`);
  Bench.result({
    passed: R.ok,
    summary: `${desc}: ${stats}.`,
    failureReason: R.ok ? undefined : why.join("; "),
    score: R.ok ? Math.round(+p.budget - R.weekly) : undefined, scoreLabel: "left in the weekly fuel budget",
    metrics: { litresPerHour: +R.lph.toFixed(2), hoursPerTank: +R.hoursPerTank.toFixed(1), weeklyCost: Math.round(R.weekly), loadPct: Math.round(R.f * 100) },
  });
}
</script>
</body>
</html>
