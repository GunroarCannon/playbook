<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="simCanvas"></canvas>
<script src="bench.js"></script>
<script>
/*
 * Checkout Rush Bench — multi-lane checkout, 1-second time steps, seeded randomness
 * (same dials always give the same day, so results are comparable across sessions).
 */
function simulate(p) {
  const rng = Bench.D.rng(424242);          // arrivals + basket sizes: the same day for every configuration
  const svcRng = Bench.D.rng(777);         // service times
  const expo = (mean, r = rng) => -Math.log(1 - r()) * mean;
  const T = Math.round(+p.shiftHours * 3600);
  const s = Math.max(1, Math.round(+p.cashiers));
  const express = !!p.expressLane && s >= 2;
  const svc = +p.serviceMin * 60, patience = +p.patienceMin * 60;
  const lanes = Array.from({ length: s }, (_, i) => ({ express: express && i === 0, queue: [], busyUntil: 0, current: null }));
  const customers = [];
  const qlen = [];
  let nextArrival = expo(3600 / +p.arrivalRate);
  for (let t = 0; t < T; t++) {
    while (nextArrival <= t) {
      const small = rng() < 0.4;
      const c = { id: customers.length, arrive: nextArrival, small, lane: -1, start: null, end: null, reneged: null };
      const options = lanes.map((l, i) => ({ l, i })).filter(({ l }) => !l.express || small);
      options.sort((a, b) => a.l.queue.length + (a.l.current ? 1 : 0) - (b.l.queue.length + (b.l.current ? 1 : 0)));
      const pick = options[0];
      c.lane = pick.i; pick.l.queue.push(c); customers.push(c);
      nextArrival += expo(3600 / +p.arrivalRate);
    }
    for (const l of lanes) {
      if (l.current && l.busyUntil <= t) { l.current.end = t; l.current = null; }
      // walkouts
      for (let i = l.queue.length - 1; i >= 0; i--) {
        const c = l.queue[i];
        if (t - c.arrive > patience) { c.reneged = t; l.queue.splice(i, 1); }
      }
      if (!l.current && l.queue.length) {
        const c = l.queue.shift();
        c.start = t;
        l.current = c;
        l.busyUntil = t + Math.max(10, expo(c.small && l.express ? svc * 0.4 : svc, svcRng));
      }
    }
    if (t % 30 === 0) qlen.push(lanes.reduce((a, l) => a + l.queue.length, 0));
  }
  const served = customers.filter((c) => c.start != null);
  const walkouts = customers.filter((c) => c.reneged != null).length;
  const waits = served.map((c) => c.start - c.arrive);
  const avgWait = waits.length ? waits.reduce((a, b) => a + b, 0) / waits.length : 0;
  const p90 = waits.length ? waits.slice().sort((a, b) => a - b)[Math.floor(waits.length * 0.9)] : 0;
  const wages = s * +p.wagePerHr * +p.shiftHours;
  const revenue = served.length * +p.marginPerCustomer;
  const profit = revenue - wages;
  const rho = (+p.arrivalRate * (+p.serviceMin / 60)) / s;
  return { customers, served: served.length, walkouts, arrivals: customers.length, avgWait, p90, wages, revenue, profit, rho, T, s, express, qlen, lanes: lanes.length };
}

let R = null, anim = null;
// On-screen people: each customer eases toward where the simulation says they are.
const disp = new Map();

function publish(p) {
  R = simulate(p);
  const peakI = R.qlen.indexOf(Math.max(...R.qlen));
  R.peakT = Math.max(0, peakI) * 30;
  disp.clear();
  Bench.metrics({
    stressRatio: R.rho,
    label: `utilisation ${(R.rho * 100).toFixed(0)}% · ${R.walkouts} walkouts · wait ${Math.round(R.avgWait)}s`,
    values: { avgWaitSec: Math.round(R.avgWait), walkouts: R.walkouts, profit: Math.round(R.profit) },
  });
}

const money = (v) => (v < 0 ? "-" : "") + Math.abs(Math.round(v)).toLocaleString();

Bench.init({
  params: { arrivalRate: 45, cashiers: 2, serviceMin: 2.5, expressLane: false, patienceMin: 6, targetWaitSec: 180, shiftHours: 2, wagePerHr: 1200, marginPerCustomer: 400 },
  onParams(p) { if (!anim || anim.done) anim = null; publish(p); },
  onReset(p) { anim = null; publish(p); },
  onRun(p) { publish(p); anim = { t0: performance.now() / 1000, dur: 10, done: false, p: { ...p } }; },
  draw(D, p, dt, now) {
    if (!R) publish(p);
    const { ctx, C } = D;
    D.grid();
    const W = D.W, H = D.H;
    const live = !!anim && !anim.done;

    const simT = anim ? Math.min(1, (now - anim.t0) / anim.dur) * R.T : R.peakT;
    if (anim && !anim.done && simT >= R.T) { anim.done = true; finish(anim.p); }

    // ---------- floor plan ----------
    const planW = W - 250, top = 96;
    const laneGap = Math.min(120, (planW - 40) / Math.max(1, R.lanes));
    const x0 = 30 + (planW - laneGap * (R.lanes - 1)) / 2;
    const slotY = (k) => top + 104 + k * 26;
    const maxSlots = Math.max(1, Math.floor((H - 90 - slotY(0)) / 26));
    const entrance = { x: 30 + planW / 2, y: H - 18 };
    const exitServed = { x: 8, y: top + 66 };
    const exitWalk = { x: W - 30, y: H - 30 };

    D.text(`Checkout rush · ${p.arrivalRate} customers/hr · ${R.s} cashier${R.s > 1 ? "s" : ""}${R.express ? " (till 1 express)" : ""}`, 18, 28, { size: 15 });
    const clock = Math.floor(simT / 60);
    const clockStr = `${String(Math.floor(clock / 60)).padStart(2, "0")}:${String(clock % 60).padStart(2, "0")}`;
    D.text(anim ? `t = ${clockStr} into the rush` : `busiest moment: ${clockStr} into the rush`, 18, 48, { size: 13, mono: true, color: C.ink2 });

    // door + exit labels
    D.line(entrance.x - 34, H - 6, entrance.x + 34, H - 6, { width: 3, color: C.ink2 });
    D.text("ENTRANCE", entrance.x, H - 12, { size: 11, align: "center", color: C.ink3, mono: true });
    D.text("← paid & left", 10, top + 40, { size: 11, color: C.green });
    D.text("walked out →", W - 22, H - 46, { size: 11, color: C.red, align: "right" });

    for (let i = 0; i < R.lanes; i++) {
      const x = x0 + i * laneGap;
      D.rect(x - 28, top, 56, 26, { hatch: true, seed: 300 + i });
      D.rect(x - 9, top - 13, 18, 13, { seed: 400 + i }); // till
      D.text(R.express && i === 0 ? "EXPRESS" : `TILL ${i + 1}`, x, top + 42, { size: 11, align: "center", mono: true, color: R.express && i === 0 ? C.blue : C.ink2 });
      figure(D, x, top - 22, C.navy, 0.8);
      // rope barrier guiding the line
      D.line(x - 22, top + 92, x - 22, slotY(maxSlots - 1) + 10, { dash: [2, 5], width: 1, color: C.ink3, single: true });
      D.line(x + 22, top + 92, x + 22, slotY(maxSlots - 1) + 10, { dash: [2, 5], width: 1, color: C.ink3, single: true });
    }

    // ---------- who is where at simT ----------
    const queues = Array.from({ length: R.lanes }, () => []);
    const serving = [];
    let served = 0, walked = 0;
    const departing = [];
    for (const c of R.customers) {
      if (c.arrive > simT) break;
      if (c.reneged != null && c.reneged <= simT) { walked++; departing.push([c, "out"]); continue; }
      if (c.start != null && c.start <= simT) {
        if (c.end == null || c.end > simT) serving.push(c);
        else { served++; departing.push([c, "done"]); }
        continue;
      }
      queues[c.lane].push(c);
    }

    const targets = new Map();
    serving.forEach((c) => targets.set(c.id, { x: x0 + c.lane * laneGap, y: top + 70, c, svc: true }));
    queues.forEach((q, i) => q.forEach((c, k) => targets.set(c.id, { x: x0 + i * laneGap + (k % 2 ? 5 : -5), y: slotY(Math.min(k, maxSlots - 1)), c, hidden: k >= maxSlots })));

    if (live) {
      const ease = Math.min(1, dt * 7);
      for (const [id, t] of targets) {
        let d = disp.get(id);
        if (!d) { d = { x: entrance.x + (Math.random() - 0.5) * 30, y: entrance.y, a: 0 }; disp.set(id, d); }
        d.x += (t.x - d.x) * ease; d.y += (t.y - d.y) * ease; d.a = Math.min(1, d.a + dt * 4);
        d.t = t;
      }
      for (const [c, kind] of departing) {
        const d = disp.get(c.id);
        if (!d) continue;
        if (!d.leaving) { d.leaving = now; d.kind = kind; }
        const to = kind === "out" ? exitWalk : exitServed;
        d.x += (to.x - d.x) * Math.min(1, dt * 3.2); d.y += (to.y - d.y) * Math.min(1, dt * 3.2);
        d.a = Math.max(0, 1 - (now - d.leaving) / 0.9);
        if (now - d.leaving > 0.9) disp.delete(c.id);
      }
    }

    const patience = +p.patienceMin * 60;
    const drawPerson = (c, x, y, alpha, opts = {}) => {
      const frac = (simT - c.arrive) / patience;
      const col = opts.kind === "out" ? C.red : opts.kind === "done" ? C.green : opts.svc ? C.ink : frac > 0.75 ? C.red : frac > 0.45 ? C.amber : C.ink;
      ctx.globalAlpha = alpha;
      figure(D, x, y, col, 0.82, c.small ? 0.6 : 1.1);
      if (opts.kind === "out") D.text("×", x + 9, y - 14, { size: 14, color: C.red });
      ctx.globalAlpha = 1;
    };

    if (live) {
      for (const [, d] of disp) {
        if (d.leaving) { drawPerson(d.t.c, d.x, d.y, d.a, { kind: d.kind }); continue; }
        if (d.t.hidden) continue;
        drawPerson(d.t.c, d.x, d.y, d.a, { svc: d.t.svc });
      }
    } else {
      for (const [, t] of targets) if (!t.hidden) drawPerson(t.c, t.x, t.y, 1, { svc: t.svc });
    }

    // service progress rings + queue counts
    serving.forEach((c) => {
      const x = x0 + c.lane * laneGap, y = top + 70;
      const prog = c.end ? D.clamp((simT - c.start) / Math.max(1, c.end - c.start), 0, 1) : 0;
      ctx.strokeStyle = C.green; ctx.lineWidth = 2.2; ctx.beginPath();
      ctx.arc(x + 20, y - 8, 7, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2); ctx.stroke();
    });
    queues.forEach((q, i) => {
      const x = x0 + i * laneGap;
      if (q.length > maxSlots) D.text(`+${q.length - maxSlots} more`, x, slotY(maxSlots - 1) + 26, { size: 11, mono: true, color: C.red, align: "center" });
      if (q.length) D.text(`${q.length} in line`, x + 26, top + 100, { size: 11, mono: true, color: q.length > 6 ? C.red : C.ink2 });
    });

    // live counters
    D.text(`✓ ${served} paid`, W - 210, 30, { size: 13, mono: true, color: C.green });
    D.text(`× ${walked} walked out`, W - 120, 30, { size: 13, mono: true, color: walked ? C.red : C.ink3 });

    // queue length sparkline (bottom-left) with a cursor at simT
    const gx = 18, gy = H - 40, gw = Math.min(200, W * 0.26), gh = 42;
    D.text("people waiting over the rush", gx, gy - gh - 8, { size: 11, color: C.ink3 });
    D.line(gx, gy, gx + gw, gy, { width: 1, single: true, color: C.ink2 });
    D.line(gx, gy, gx, gy - gh, { width: 1, single: true, color: C.ink2 });
    const maxQ = Math.max(4, ...R.qlen);
    ctx.strokeStyle = C.navy; ctx.lineWidth = 1.6; ctx.beginPath();
    R.qlen.forEach((q, i) => {
      const x = gx + (i / (R.qlen.length - 1)) * gw, y = gy - (q / maxQ) * gh;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.globalAlpha = anim ? 0.25 : 1; ctx.stroke(); ctx.globalAlpha = 1;
    if (anim) {
      ctx.beginPath();
      const upto = Math.floor((simT / R.T) * (R.qlen.length - 1));
      R.qlen.slice(0, upto + 1).forEach((q, i) => { const x = gx + (i / (R.qlen.length - 1)) * gw, y = gy - (q / maxQ) * gh; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke();
    }
    const cx = gx + (simT / R.T) * gw;
    D.line(cx, gy, cx, gy - gh, { color: C.red, width: 1, single: true, dash: [2, 3] });

    // receipt panel (top-right)
    const rx = W - 210, ry = 52;
    D.rect(rx, ry, 190, 128, { fill: C.paper, seed: 999 });
    const lines = [
      ["arrivals", R.arrivals], ["served", R.served], ["walkouts", R.walkouts],
      ["avg wait", `${Math.round(R.avgWait)} s`], ["90% wait", `${Math.round(R.p90)} s`],
      ["wages", money(R.wages)], ["profit", money(R.profit)],
    ];
    lines.forEach(([k, v], i) => {
      D.text(k, rx + 10, ry + 20 + i * 15, { size: 11, mono: true, color: C.ink2 });
      const bad = (k === "walkouts" && R.walkouts > R.arrivals * 0.02) || (k === "avg wait" && R.avgWait > +p.targetWaitSec) || (k === "profit" && R.profit <= 0);
      D.text(String(v), rx + 180, ry + 20 + i * 15, { size: 11, mono: true, align: "right", color: bad ? C.red : C.ink });
    });
    D.text(anim ? "whole-rush totals" : "projection · press RUN TEST to watch", rx + 4, ry + 146, { size: 11, color: C.ink3 });

    if (anim && anim.done) {
      const ok = pass(p);
      D.stamp(ok ? "SMOOTH RUSH" : "MELTDOWN", W - 120, H - 90, ok ? C.green : C.red);
    }
  },
});

function pass(p) { return R.avgWait <= +p.targetWaitSec && R.walkouts <= Math.max(0, R.arrivals * 0.02) && R.profit > 0; }

function finish(p) {
  const desc = `${R.s} cashier${R.s > 1 ? "s" : ""}${R.express ? " incl. express lane" : ""}, ${p.arrivalRate} cust/hr, ${p.serviceMin} min service, ${p.patienceMin} min patience, ${p.shiftHours}h rush`;
  const stats = `avg wait ${Math.round(R.avgWait)}s, ${R.walkouts} of ${R.arrivals} walked out, profit ${money(R.profit)}`;
  const reasons = [];
  if (R.avgWait > +p.targetWaitSec) reasons.push(`average wait ${Math.round(R.avgWait)}s is over the ${p.targetWaitSec}s target`);
  if (R.walkouts > R.arrivals * 0.02) reasons.push(`${R.walkouts} customers walked out`);
  if (R.profit <= 0) reasons.push(`wages ${money(R.wages)} exceed margin ${money(R.revenue)}`);
  const ok = !reasons.length;
  Bench.result({
    passed: ok,
    summary: `${desc}: ${stats}.`,
    failureReason: ok ? undefined : reasons.join("; "),
    score: ok ? Math.round(R.profit) : undefined, scoreLabel: "profit",
    metrics: { avgWaitSec: Math.round(R.avgWait), walkouts: R.walkouts, arrivals: R.arrivals, profit: Math.round(R.profit), utilisation: +R.rho.toFixed(2) },
  });
}

function figure(D, x, y, col, s = 1, basket = 0) {
  const { ctx } = D;
  ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(x, y - 10 * s, 4.4 * s, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y - 5.6 * s); ctx.lineTo(x, y + 6 * s);
  ctx.moveTo(x - 6 * s, y - 1 * s); ctx.lineTo(x, y - 3 * s); ctx.lineTo(x + 7 * s, y + 1 * s);
  ctx.moveTo(x, y + 6 * s); ctx.lineTo(x - 5 * s, y + 14 * s);
  ctx.moveTo(x, y + 6 * s); ctx.lineTo(x + 5 * s, y + 14 * s);
  ctx.stroke();
  if (basket) {
    const bw = 7 * basket * s, bh = 5 * basket * s, bx = x + 7 * s - bw / 2, by = y + 1 * s;
    ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.moveTo(bx + 1, by); ctx.quadraticCurveTo(bx + bw / 2, by - bh, bx + bw - 1, by); ctx.stroke();
  }
}
</script>
</body>
</html>
