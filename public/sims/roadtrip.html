<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="simCanvas"></canvas>
<script src="bench.js"></script>
<script>
/*
 * Road Trip Fuel Bench — km by km.
 * Consumption (L/100 km) = the vehicle's figure at 90 km/h x speed factor (0.55 + 0.45 (v/90)^2: air drag grows
 * with speed squared) x load (+1.5% per extra passenger, buses +0.6%) x AC (+8%) x roof load (+12%).
 * Filling stations with fuel every `stationGapKm`; at each one you fill up if the tank is under half.
 * Passes when the tank never runs empty before the next station or the destination.
 */
const CAR = {
  small: { name: "small car", l100: 5.5, per: 0.015 },
  sedan: { name: "saloon car", l100: 7.5, per: 0.015 },
  suv:   { name: "SUV", l100: 10.5, per: 0.012 },
  bus:   { name: "18-seater bus", l100: 13, per: 0.006 },
};

function simulate(p) {
  const car = CAR[p.car] || CAR.sedan, v = +p.speedKmh, dist = +p.distanceKm, tank = +p.tankL;
  const speedF = 0.55 + 0.45 * Math.pow(v / 90, 2) + (v < 50 ? (50 - v) * 0.01 : 0);
  const l100 = car.l100 * speedF * (1 + car.per * Math.max(0, +p.passengers - 1)) * (p.ac ? 1.08 : 1) * (p.roofLoad ? 1.12 : 1);
  const perKm = l100 / 100, gap = +p.stationGapKm;
  let fuel = (tank * +p.startPct) / 100, used = 0, stops = 0, low = fuel, ranOut = null, bought = 0;
  const trace = [{ km: 0, fuel }];
  const stations = [];
  for (let s = gap; s < dist; s += gap) stations.push(s);
  let km = 0;
  const marks = [...stations, dist];
  for (let i = 0; i < marks.length; i++) {
    const next = marks[i];
    const need = (next - km) * perKm;
    if (need > fuel) { ranOut = km + fuel / perKm; used += fuel; fuel = 0; trace.push({ km: ranOut, fuel: 0 }); break; }
    fuel -= need; used += need; km = next; low = Math.min(low, fuel);
    trace.push({ km, fuel });
    // fill up when under half a tank, or when what's left won't safely reach the next stop
    const after = i + 1 < marks.length ? (marks[i + 1] - next) * perKm * 1.2 : 0;
    if (next < dist && (fuel < tank / 2 || fuel < after)) { bought += tank - fuel; fuel = tank; stops++; trace.push({ km, fuel }); }
  }
  const hours = dist / v + stops * (10 / 60);
  return { car, l100, perKm, used, stops, low, ranOut, trace, stations, dist, tank, cost: used * +p.priceL, hours, range: (tank / perKm), ok: ranOut == null };
}

const money = (v) => Math.round(v).toLocaleString();
const hm = (h) => `${Math.floor(h)} h ${String(Math.round((h % 1) * 60)).padStart(2, "0")} min`;

let R = null, anim = null;
function publish(p) {
  R = simulate(p);
  Bench.metrics({
    stressRatio: R.ok ? Math.min(0.95, 1 - R.low / Math.max(1, R.tank)) : 1.3,
    label: R.ok ? `${R.l100.toFixed(1)} L/100 km · ${R.used.toFixed(0)} L, ${money(R.cost)} · ${hm(R.hours)}` : `runs dry at km ${Math.round(R.ranOut)} · ${R.l100.toFixed(1)} L/100 km`,
    values: { litresPer100km: +R.l100.toFixed(1), litresUsed: Math.round(R.used), fuelCost: Math.round(R.cost), rangeKm: Math.round(R.range) },
  });
}

Bench.init({
  params: { distanceKm: 520, speedKmh: 100, car: "sedan", tankL: 50, startPct: 100, passengers: 2, ac: true, roofLoad: false, stationGapKm: 150, priceL: 1000 },
  onParams(p) { if (!anim || anim.done) anim = null; publish(p); },
  onReset(p) { anim = null; publish(p); },
  onRun(p) { publish(p); anim = { t0: performance.now() / 1000, dur: 6, done: false, p: { ...p } }; },
  draw(D, p, dt, now) {
    if (!R) publish(p);
    const { ctx, C } = D;
    D.grid();
    const W = D.W, H = D.H;
    const prog = anim ? Math.min(1, (now - anim.t0) / anim.dur) : 0;
    if (anim && !anim.done && prog >= 1) { anim.done = true; finish(anim.p); }
    const endKm = R.ok ? R.dist : R.ranOut;
    const kmNow = endKm * (anim ? prog : 0);
    // fuel at kmNow from the trace
    let fuelNow = R.trace[0].fuel;
    for (let i = 1; i < R.trace.length; i++) {
      const a = R.trace[i - 1], b = R.trace[i];
      if (b.km <= kmNow) fuelNow = b.fuel;
      else { if (b.km > a.km) fuelNow = a.fuel - (kmNow - a.km) * R.perKm; break; }
    }

    D.text(`${p.distanceKm} km in a ${R.car.name} at ${p.speedKmh} km/h · ${p.passengers} on board${p.ac ? " · AC on" : ""}${p.roofLoad ? " · roof rack loaded" : ""}`, 18, 28, { size: 14 });
    D.text(`${R.l100.toFixed(1)} L/100 km → ${Math.round(R.range)} km on a full ${p.tankL} L tank · stations every ${p.stationGapKm} km`, 18, 48, { size: 12, mono: true, color: C.ink2 });

    // ---- the road
    const rx0 = 50, rx1 = W - 60, ry = 104;
    const X = (km) => rx0 + (km / R.dist) * (rx1 - rx0);
    D.line(rx0, ry + 14, rx1, ry + 14, { width: 2 });
    D.line(rx0, ry - 14, rx1, ry - 14, { width: 1.2, color: C.ink3 });
    for (let k = rx0; k < rx1; k += 26) D.line(k, ry, k + 12, ry, { color: C.ink3, width: 1.6, single: true, rough: 0.2 });
    for (const s of R.stations) { D.icon("gas-pump", X(s), ry - 30, 18, { color: C.green }); D.text(`${s}`, X(s), ry + 32, { size: 9, mono: true, align: "center", color: C.ink3 }); }
    D.icon("city", X(R.dist), ry - 32, 22, { color: C.ink });
    D.text(`${R.dist} km`, X(R.dist), ry + 32, { size: 10, mono: true, align: "center" });
    D.icon("house", X(0), ry - 30, 18, { color: C.ink2 });
    if (!R.ok) { D.line(X(R.ranOut), ry - 22, X(R.ranOut), ry + 22, { color: C.red, width: 1.4, dash: [3, 3], single: true }); D.text(`empty: km ${Math.round(R.ranOut)}`, X(R.ranOut), ry + 46, { size: 11, align: "center", color: C.red }); }
    D.icon("car-side", X(kmNow), ry - 2, 22, { color: fuelNow < R.tank * 0.15 ? C.red : C.navy });

    // ---- fuel along the way
    const gx = 70, gy0 = 170, gw = Math.max(200, W - gx - 160), gh = Math.max(90, H - gy0 - 60), gy = gy0 + gh;
    const GX = (km) => gx + (km / R.dist) * gw, GY = (f) => gy - (f / R.tank) * gh;
    D.line(gx, gy, gx + gw, gy, { width: 1.3 }); D.line(gx, gy0, gx, gy, { width: 1.3 });
    D.text(`${p.tankL} L`, gx - 6, gy0 + 4, { size: 10, mono: true, align: "right", color: C.ink3 });
    D.text("0", gx - 6, gy + 4, { size: 10, mono: true, align: "right", color: C.ink3 });
    D.line(gx, GY(R.tank / 2), gx + gw, GY(R.tank / 2), { color: C.ink3, dash: [3, 5], width: 1, single: true });
    D.text("fill up below half", gx + gw - 4, GY(R.tank / 2) - 4, { size: 10, align: "right", color: C.ink3 });
    ctx.strokeStyle = C.amber; ctx.lineWidth = 2.4; ctx.beginPath();
    let started = false;
    const lim = anim ? kmNow : endKm;
    for (let i = 0; i < R.trace.length; i++) {
      const pt = R.trace[i];
      if (pt.km > lim) { const a = R.trace[i - 1]; ctx.lineTo(GX(lim), GY(a.fuel - (lim - a.km) * R.perKm)); break; }
      started ? ctx.lineTo(GX(pt.km), GY(pt.fuel)) : ctx.moveTo(GX(pt.km), GY(pt.fuel)); started = true;
    }
    ctx.stroke();
    D.text("fuel in the tank", gx + 8, gy0 + 14, { size: 11, color: C.amber });

    // gauge
    const cx = W - 80, cy = gy0 + 60;
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(cx, cy, 40, Math.PI, 0); ctx.stroke();
    D.text("E", cx - 44, cy + 14, { size: 11, mono: true, color: C.red }); D.text("F", cx + 38, cy + 14, { size: 11, mono: true });
    const f = D.clamp((anim ? fuelNow : R.tank * +p.startPct / 100) / R.tank, 0, 1), na = Math.PI + f * Math.PI;
    D.line(cx, cy, cx + Math.cos(na) * 32, cy + Math.sin(na) * 32, { color: f < 0.15 ? C.red : C.ink, width: 2.2, single: true });
    D.text(`${Math.max(0, anim ? fuelNow : R.tank * +p.startPct / 100).toFixed(1)} L`, cx, cy + 20, { size: 12, mono: true, align: "center" });
    D.text(`${money(R.cost)}`, cx, cy + 50, { size: 12, mono: true, align: "center", color: C.ink2 });
    D.text(`${R.stops} fuel stop${R.stops === 1 ? "" : "s"}`, cx, cy + 66, { size: 11, align: "center", color: C.ink2 });

    if (anim && anim.done) D.stamp(R.ok ? "MADE IT" : `STRANDED AT KM ${Math.round(R.ranOut)}`, W / 2, gy0 + gh * 0.4, R.ok ? C.green : C.red);
    if (!anim) D.text("(projection — press RUN TEST to drive it)", 18, H - 12, { size: 11, color: C.ink3 });
  },
});

function finish(p) {
  const desc = `${p.distanceKm} km in a ${R.car.name} at ${p.speedKmh} km/h, ${p.passengers} on board${p.ac ? ", AC on" : ""}${p.roofLoad ? ", roof rack loaded" : ""}, ${p.tankL} L tank starting ${p.startPct}% full, stations every ${p.stationGapKm} km`;
  const stats = R.ok
    ? `uses ${R.l100.toFixed(1)} L/100 km, ${R.used.toFixed(0)} L in total (${money(R.cost)}), ${R.stops} fuel stop${R.stops === 1 ? "" : "s"}, about ${hm(R.hours)}, never below ${R.low.toFixed(1)} L`
    : `uses ${R.l100.toFixed(1)} L/100 km and runs dry at km ${Math.round(R.ranOut)}`;
  const why = R.range < +p.stationGapKm
    ? `a full tank only goes ${Math.round(R.range)} km but stations are ${p.stationGapKm} km apart; slow down or carry a jerrycan`
    : `it set off with too little fuel (${p.startPct}%) to reach the first station at ${p.stationGapKm} km`;
  Bench.result({
    passed: R.ok,
    summary: `${desc}: ${stats}.`,
    failureReason: R.ok ? undefined : why,
    score: R.ok ? +R.low.toFixed(1) : undefined, scoreLabel: "litres left at the lowest point",
    metrics: { litresPer100km: +R.l100.toFixed(1), litresUsed: Math.round(R.used), fuelCost: Math.round(R.cost), rangeKm: Math.round(R.range), stops: R.stops },
  });
}
</script>
</body>
</html>
