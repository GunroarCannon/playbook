<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="simCanvas"></canvas>
<script src="bench.js"></script>
<script>
/*
 * Savings Goal Bench — month by month: interest compounds monthly, the deposit rises once a year,
 * and inflation shrinks what the money can buy. The goal is in TODAY's money.
 * Optional emergency: halfway through, 3 months of savings come out.
 */
function simulate(p) {
  const months = Math.round(+p.years * 12);
  const r = +p.interestPct / 100 / 12, inf = Math.pow(1 + +p.inflationPct / 100, 1 / 12) - 1;
  let bal = +p.startAmount, dep = +p.monthly, deposited = +p.startAmount, interest = 0, prices = 1;
  const series = [{ m: 0, bal, real: bal, deposited }];
  let hitAt = null, withdrawn = 0;
  for (let m = 1; m <= months; m++) {
    if (m > 1 && (m - 1) % 12 === 0) dep *= 1 + +p.raisePct / 100;
    const earned = bal * r; interest += earned;
    bal += earned + dep; deposited += dep; prices *= 1 + inf;
    if (p.emergency && m === Math.round(months / 2)) { withdrawn = Math.min(bal, dep * 3); bal -= withdrawn; }
    const real = bal / prices;
    if (hitAt == null && real >= +p.goal) hitAt = m;
    series.push({ m, bal, real, deposited });
  }
  const last = series[series.length - 1];
  return { months, series, final: last.bal, real: last.real, deposited, interest, prices, hitAt, withdrawn, goal: +p.goal, goalNominal: +p.goal * prices };
}

const money = (v) => Math.round(v).toLocaleString();
const ym = (m) => `${Math.floor(m / 12)}y ${m % 12}m`;

let R = null, anim = null;
function publish(p) {
  R = simulate(p);
  Bench.metrics({
    stressRatio: R.real > 0 ? Math.min(1.5, R.goal / R.real) : 1.5,
    label: `${Math.round((R.real / R.goal) * 100)}% of goal in today's money${R.hitAt ? ` · reached at ${ym(R.hitAt)}` : ""}`,
    values: { finalNominal: Math.round(R.final), finalReal: Math.round(R.real), pctOfGoal: Math.round((R.real / R.goal) * 100) },
  });
}

Bench.init({
  params: { startAmount: 0, monthly: 50000, raisePct: 0, interestPct: 10, inflationPct: 20, years: 3, goal: 2000000, emergency: false },
  onParams(p) { if (!anim || anim.done) anim = null; publish(p); },
  onReset(p) { anim = null; publish(p); },
  onRun(p) { publish(p); anim = { t0: performance.now() / 1000, dur: 5, done: false, p: { ...p } }; },
  draw(D, p, dt, now) {
    if (!R) publish(p);
    const { ctx, C } = D;
    D.grid();
    const W = D.W, H = D.H;
    const prog = anim ? Math.min(1, (now - anim.t0) / anim.dur) : 1;
    if (anim && !anim.done && prog >= 1) { anim.done = true; finish(anim.p); }
    const upto = Math.max(1, Math.floor(prog * R.months));
    const cur = R.series[upto];

    D.text(`Saving ${money(p.monthly)}/month${+p.raisePct ? ` (+${p.raisePct}%/yr)` : ""} at ${p.interestPct}% interest, ${p.inflationPct}% inflation, for ${p.years} years`, 18, 28, { size: 14 });
    D.text(`goal: ${money(R.goal)} in today's money = ${money(R.goalNominal)} by then`, 18, 48, { size: 12, mono: true, color: C.ink2 });

    const jarW = 120, gx = 70, gyTop = 74, gw = Math.max(200, W - gx - jarW - 70), gh = Math.max(120, H - 150), gy = gyTop + gh;
    const maxV = Math.max(R.final, R.goalNominal, R.goal, 1) * 1.08;
    const Y = (v) => gy - (v / maxV) * gh, X = (m) => gx + (m / R.months) * gw;
    D.line(gx, gy, gx + gw, gy, { width: 1.3 }); D.line(gx, gy, gx, gyTop, { width: 1.3 });
    for (let k = 0; k <= 4; k++) D.text(money((maxV * k) / 4), gx - 6, Y((maxV * k) / 4) + 4, { size: 10, mono: true, align: "right", color: C.ink3 });
    for (let y = 0; y <= +p.years; y += +p.years > 10 ? 5 : 1) D.text(`yr ${y}`, X(y * 12), gy + 14, { size: 10, mono: true, align: "center", color: C.ink3 });

    // goal line (today's money) and inflated goal
    D.line(gx, Y(R.goal), gx + gw, Y(R.goal), { color: C.green, dash: [6, 4], width: 1.3, single: true });
    D.text(`goal ${money(R.goal)} (today's money)`, gx + 6, Y(R.goal) - 5, { size: 11, color: C.green });

    const path = (key, col, w, dash) => {
      ctx.strokeStyle = col; ctx.lineWidth = w; if (dash) ctx.setLineDash(dash); ctx.beginPath();
      for (let i = 0; i <= upto; i++) { const s = R.series[i]; i ? ctx.lineTo(X(s.m), Y(s[key])) : ctx.moveTo(X(s.m), Y(s[key])); }
      ctx.stroke(); ctx.setLineDash([]);
    };
    path("deposited", C.ink3, 1.2, [3, 3]);
    path("bal", C.navy, 2.2);
    path("real", C.amber, 2.6);
    const lx = gx + 10, ly = gyTop + 8;
    [["balance (numbers on the statement)", C.navy], ["what it can actually buy (today's money)", C.amber], ["what you put in", C.ink3]].forEach(([t, c], i) => {
      D.line(lx, ly + i * 16, lx + 18, ly + i * 16, { color: c, width: 2.4, single: true }); D.text(t, lx + 24, ly + 4 + i * 16, { size: 11 });
    });
    if (p.emergency) { const m = Math.round(R.months / 2); if (m <= upto) D.text("↓ emergency", X(m), Y(R.series[m].bal) - 10, { size: 11, color: C.red, align: "center" }); }

    // coin jar: filled to (real value / goal)
    const jx = W - jarW - 30, jy = gyTop + 30, jh = Math.min(200, gh - 40);
    const fill = D.clamp(cur.real / R.goal, 0, 1);
    D.rect(jx, jy, jarW, jh, { seed: 77 });
    D.rect(jx + 12, jy - 14, jarW - 24, 14, { seed: 78, hatch: true });
    const fh = (jh - 8) * fill;
    ctx.fillStyle = fill >= 1 ? C.green : C.amber; ctx.globalAlpha = 0.35; ctx.fillRect(jx + 4, jy + jh - 4 - fh, jarW - 8, fh); ctx.globalAlpha = 1;
    const coins = Math.floor(fill * 18), rr = D.rng(5);
    for (let k = 0; k < coins; k++) D.circle(jx + 16 + (k % 4) * 26 + rr() * 6, jy + jh - 14 - Math.floor(k / 4) * ((jh - 20) / 5), 8, { seed: 90 + k, color: C.amber });
    D.text(`${Math.round(fill * 100)}%`, jx + jarW / 2, jy + jh + 22, { size: 16, mono: true, align: "center" });
    D.text(`month ${cur.m}`, jx + jarW / 2, jy + jh + 40, { size: 11, mono: true, align: "center", color: C.ink2 });

    if (anim && anim.done) D.stamp(R.real >= R.goal ? "GOAL REACHED" : "FELL SHORT", gx + gw * 0.6, gyTop + gh * 0.45, R.real >= R.goal ? C.green : C.red);
    if (!anim) D.text("(projection — press RUN TEST to watch the years go by)", gx, H - 12, { size: 11, color: C.ink3 });
  },
});

function finish(p) {
  const desc = `${money(p.monthly)}/month${+p.raisePct ? ` rising ${p.raisePct}%/yr` : ""}${+p.startAmount ? ` plus ${money(p.startAmount)} to start` : ""}, ${p.interestPct}% interest, ${p.inflationPct}% inflation, ${p.years} years${p.emergency ? ", one emergency withdrawal" : ""}`;
  const stats = `ends with ${money(R.final)} on paper, worth ${money(R.real)} in today's money (${Math.round((R.real / R.goal) * 100)}% of the ${money(R.goal)} goal)`;
  const ok = R.real >= R.goal;
  const reasons = [];
  if (+p.inflationPct > +p.interestPct) reasons.push(`inflation (${p.inflationPct}%) beats the interest rate (${p.interestPct}%), so the money loses buying power`);
  reasons.push(`short by ${money(R.goal - R.real)} in today's money`);
  Bench.result({
    passed: ok,
    summary: `${desc}: ${stats}.`,
    failureReason: ok ? undefined : reasons.join("; "),
    score: ok ? Math.round((R.real / R.goal) * 100) : undefined, scoreLabel: "% of goal",
    metrics: { finalNominal: Math.round(R.final), finalReal: Math.round(R.real), deposited: Math.round(R.deposited), interest: Math.round(R.interest), reachedMonth: R.hitAt },
  });
}
</script>
</body>
</html>
